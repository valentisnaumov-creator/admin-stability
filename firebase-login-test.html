<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тест входа Firebase — Admin Stability</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:24px;font:16px system-ui;background:#101827;color:#f4f5ff}main{max-width:540px;margin:auto}section{padding:20px;background:#1d293b;border:1px solid #364357;border-radius:18px}h1{font-size:24px}p{line-height:1.6;color:#b9c6d9}label{display:block;margin:14px 0 6px}input,button{width:100%;padding:13px;border-radius:10px;font:inherit}input{border:1px solid #52637a;background:#101827;color:white}button{margin-top:15px;border:0;background:#8b75ef;color:white;font-weight:700}button:disabled{opacity:.6}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:#080f1b;border-radius:12px}a{color:#b7aaff}
</style></head><body><main><h1>Проверка входа Firebase</h1><p>Отдельный тест. Основной сайт не изменяется. Используй только тестовый аккаунт, созданный в Firebase Authentication. Пароль никуда, кроме Firebase Authentication, не отправляется.</p><section><form id="login"><label for="email">Почта тестового аккаунта</label><input id="email" type="email" autocomplete="username" required><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">Проверить вход</button></form><button id="logout" type="button" hidden>Выйти из тестового аккаунта</button></section><h2>Результат</h2><pre id="status" aria-live="polite">Ожидание…</pre><p><a href="./">На основной сайт</a></p></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,setPersistence,inMemoryPersistence}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const config={apiKey:"AIzaSyBnLplD3Ad4Y3G1PU67bf9K8Whm5BV8BnM",authDomain:"admin-stability.firebaseapp.com",projectId:"admin-stability",storageBucket:"admin-stability.firebasestorage.app",messagingSenderId:"623182674109",appId:"1:623182674109:web:7f7e570f4dfa78ff08dfd4"};
const auth=getAuth(initializeApp(config)),db=getFirestore(auth.app),form=document.getElementById("login"),status=document.getElementById("status"),logout=document.getElementById("logout"),submit=document.getElementById("submit");
const say=s=>status.textContent=s;
await setPersistence(auth,inMemoryPersistence);
onAuthStateChanged(auth,u=>{logout.hidden=!u;if(u)say("Вход выполнен: "+u.email+"\nПроверка Firestore доступна после входа.");});
form.addEventListener("submit",async e=>{e.preventDefault();submit.disabled=true;say("Проверяем вход…");try{const c=await signInWithEmailAndPassword(auth,document.getElementById("email").value.trim(),document.getElementById("password").value);document.getElementById("password").value="";say("Firebase Authentication: успешно\nПроверяем защищённый запрос к Firestore…");try{const result=await Promise.race([getDoc(doc(db,"migration_probe","connectivity")),new Promise((_,reject)=>setTimeout(()=>reject(new Error("Превышено время ожидания Firestore (12 секунд)")),12000))]);say("Firebase Authentication: успешно\nFirestore: запрос обработан; документ "+(result.exists()?"найден":"не найден")+".\nВНИМАНИЕ: это ещё не проверка записи и ролей.");}catch(err){say("Firebase Authentication: успешно\nFirestore: "+(err.code||"ошибка")+" — "+err.message+"\nПри закрытых правилах permission-denied ожидаем.");}}catch(err){say("Ошибка входа: "+(err.code||"unknown")+" — "+err.message);}finally{submit.disabled=false;}});
logout.addEventListener("click",async()=>{await signOut(auth);say("Выход выполнен.");});
</script></body></html>
