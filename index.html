<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>Стабильность администрации</title><link rel="stylesheet" href="styles.css"></head><body><header><div><span class="eyebrow">МАТРЁШКА RP · АДМИНИСТРАЦИЯ</span><h1>Стабильность администрации</h1><p>Норма, неактив и дисциплина состава</p></div><button id="theme" class="icon">◐</button></header><main><nav class="tabs"><button class="active" data-view="month">Месяц</button><button data-view="day">Норма за день</button><button data-view="manage">Управление</button></nav><section id="monthView"><div class="toolbar"><div class="month"><button id="prev">‹</button><strong id="monthLabel"></strong><button id="next">›</button></div><input id="search" placeholder="Поиск по нику…"><select id="role"><option value="">Все должности</option><option>Администратор</option><option>Стажер</option></select></div><section id="stats" class="stats"></section><div class="legend"><span>🟢 Норма</span><span>🔴 Неактив</span><span>⚪ Нет данных</span></div><section id="cards" class="cards"></section></section><section id="dayView" hidden><div class="sectionHead"><div><span class="eyebrow">ЕЖЕДНЕВНЫЙ ОТЧЁТ</span><h2>Норма за день</h2></div><input type="date" id="dayDate"></div><div id="dayList" class="dayList"></div></section><section id="manageView" hidden><div class="sectionHead"><div><span class="eyebrow">СОСТАВ</span><h2>Управление администрацией</h2></div><button id="addBtn" class="primary">+ Добавить</button></div><div id="manageList" class="manageList"></div></section></main><dialog id="editDialog"><form id="editForm"><button type="button" class="close" data-close>×</button><h2 id="editTitle">Отметка за день</h2><input type="hidden" id="editId"><label>Дата<input type="date" id="editDate" required></label><label>Статус<select id="editStatus"><option value="norm">Норма выполнена</option><option value="inactive">Неактив</option><option value="none">Нет отметки</option></select></label><label>Норма за день<input type="number" id="editNorm" min="0" step="1" placeholder="Например: 120"></label><label>Комментарий<textarea id="editNote" placeholder="Необязательно"></textarea></label><button class="primary" type="submit">Сохранить</button></form></dialog><dialog id="staffDialog"><form id="staffForm"><button type="button" class="close" data-close>×</button><h2 id="staffTitle">Добавить сотрудника</h2><input type="hidden" id="staffId"><label>Ник<input id="staffName" required placeholder="Nickname_Name"></label><label>Должность<select id="staffRole"><option>Администратор</option><option>Стажер</option></select></label><div class="two"><label>Ж/К<input id="staffYellow" type="number" min="0" max="3" value="0"></label><label>К/К<input id="staffRed" type="number" min="0" max="1" value="0"></label></div><button class="primary" type="submit">Сохранить</button><button id="deleteStaff" type="button" class="danger" hidden>Удалить сотрудника</button></form></dialog><script src="app.js"></script></body></html>
