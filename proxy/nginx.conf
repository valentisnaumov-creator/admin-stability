# Admin Stability: Supabase reverse proxy
# Configure DNS api.example.com -> VPS IP, then install TLS with certbot.
# Replace api.example.com in both server_name and certbot command.
server {
    listen 80;
    server_name api.example.com;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name api.example.com;
    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    client_max_body_size 20m;
    proxy_read_timeout 90s;
    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://valentisnaumov-creator.github.io" always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
            add_header Access-Control-Allow-Headers "authorization,apikey,content-type,x-client-info,prefer,accept,range,x-supabase-api-version" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        proxy_pass https://iguotkyyjatilbzunvsw.supabase.co;
        proxy_ssl_server_name on;
        proxy_ssl_name iguotkyyjatilbzunvsw.supabase.co;
        proxy_set_header Host iguotkyyjatilbzunvsw.supabase.co;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_redirect off;
        add_header Access-Control-Allow-Origin "https://valentisnaumov-creator.github.io" always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "authorization,apikey,content-type,x-client-info,prefer,accept,range,x-supabase-api-version" always;
        add_header Access-Control-Expose-Headers "content-range,range" always;
        add_header Vary Origin always;
    }
}
