<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка Firebase — Стабильность администрации</title><style>body{font:16px system-ui;background:#111827;color:#f5f5fa;margin:0;padding:20px}main{max-width:620px;margin:auto}h1{font-size:24px}.box{background:#202b40;border-radius:14px;padding:16px;margin:12px 0}small,p{color:#c4c8d4;line-height:1.6}strong{display:block;margin-top:8px}button{background:#8275ed;border:0;color:white;padding:13px 16px;border-radius:10px;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#202b40;padding:14px;border-radius:10px}a{color:#c0b5ff}</style></head><body><main><h1>Проверка Firebase</h1><p>Без входа и без паролей. Проверяем, загружается ли Firebase SDK и отвечает ли сервер нового проекта. Это не перенос данных.</p><div class="box">Загрузка Firebase SDK<strong id="sdk">Проверяем…</strong></div><div class="box">Доступ к Firebase Authentication<strong id="auth">Проверяем…</strong></div><div class="box">Доступ к Cloud Firestore<strong id="firestore">Проверяем…</strong></div><button id="retry">Повторить</button> <button id="copy">Скопировать результат</button><pre id="report"></pre><p><a href="./">Вернуться на основной сайт</a></p></main><script type="module">
const cfg={apiKey:"AIzaSyBnLplD3Ad4Y3G1PU67bf9K8Whm5BV8BnM",authDomain:"admin-stability.firebaseapp.com",projectId:"admin-stability",storageBucket:"admin-stability.firebasestorage.app",messagingSenderId:"623182674109",appId:"1:623182674109:web:7f7e570f4dfa78ff08dfd4"};const results={};const status=(id,v)=>{results[id]=v;document.getElementById(id).textContent=v;document.getElementById('report').textContent=Object.entries(results).map(([k,v])=>k+': '+v).join('\n')};async function bounded(p,ms=9000){let t;try{return await Promise.race([p,new Promise((_,rej)=>t=setTimeout(()=>rej(new Error('Нет ответа за '+ms/1000+' секунд')),ms))])}finally{clearTimeout(t)}}async function run(){['sdk','auth','firestore'].forEach(k=>status(k,'Проверяем…'));let app,auth,db;try{const [a,b,c]=await bounded(Promise.all([import('https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js')]));app=a.initializeApp(cfg,'diagnostics-'+Date.now());auth=b.getAuth(app);db=c.getFirestore(app);status('sdk','SDK загружен успешно');const [authResult,fireResult]=await Promise.allSettled([bounded(fetch('https://identitytoolkit.googleapis.com/v1/accounts:createAuthUri?key='+encodeURIComponent(cfg.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:'test@example.invalid',continueUri:location.origin})}).then(r=>r.status)),bounded(fetch('https://firestore.googleapis.com/v1/projects/'+cfg.projectId+'/databases/(default)/documents/__connectivity_probe__').then(r=>r.status))]);status('auth',authResult.status==='fulfilled'?'Сервер ответил (HTTP '+authResult.value+')':'Ошибка: '+authResult.reason.message);status('firestore',fireResult.status==='fulfilled'?'Сервер ответил (HTTP '+fireResult.value+')':'Ошибка: '+fireResult.reason.message)}catch(e){status('sdk','Ошибка: '+e.message);status('auth','Не проверено');status('firestore','Не проверено')}}document.getElementById('retry').onclick=run;document.getElementById('copy').onclick=()=>{const t=document.getElementById('report').textContent;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).catch(()=>prompt('Скопируйте:',t));else prompt('Скопируйте:',t)};run();
</script></body></html>
